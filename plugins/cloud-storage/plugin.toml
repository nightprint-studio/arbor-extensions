name        = "cloud-storage"
version     = "1.0.3"
description = "Object storage in Arbor — browse, upload, download and sync buckets. The panel and the connection settings; the backends that talk to each store ship as their own packages."
author      = "Nightprint Studio"
repository  = "https://github.com/nightprint-studio/arbor-extensions"
category    = "data"
keywords    = ["cloud", "gcs", "s3", "azure", "storage", "sync"]
arbor_api   = 1
doc_file    = "doc.html"

# The Lua half, and in this package the only half. The providers are separate packages that
# depend on this one — see `plugins/cloud-gcs`. Splitting them means somebody who only uses
# S3 never carries GCS's OAuth code, and a third party can add a backend without touching
# anything here.
[lua]
entry = "main.lua"

[permissions]
# Local filesystem read/write for downloads & uploads. The user picks paths through the
# native picker, so the scope cannot be narrowed to a repo.
fs       = "write"
fs_scope = ["*"]

# NOTE: no `network`. This package does not talk to any store — that is the providers' job,
# and they hold the permission for the hosts they actually reach. A UI package with a network
# allowlist would be a UI package that could be made to fetch.

# For a chunk-merger handler, when one is installed: `chunks.lua` calls
# `arbor.service.call("<handler-plugin>.merge", …)` for the merges that are NOT plain
# concatenations. The ordinary chunked download needs none of this — it appends each part to
# the output as it arrives — so this permission is what a handler needs, not what the feature
# needs.
service_call = true

# The panel's own secrets — a service-account file's contents, an access key — as one JSON
# document keyed by connection. One slot rather than one per connection because slots are
# declared statically and connections are made at runtime; the alternative would be a manifest
# that has to be edited to add a bucket.
#
# A provider's OAuth token is NOT here: it lives in the provider package's own slot, which is
# the package that reads it. This one cannot name that one, which is the whole point.
[[credentials]]
key   = "connection-secrets"
label = "Cloud connection secrets"

# The shared object-storage logic. Optional on purpose: every call through it has a local
# fallback, so the panel browses and transfers without it — what it cannot do alone is plan a
# sync, and it says so rather than guessing. Declared so the Marketplace offers the pair.
[[dependencies]]
name     = "cloud-toolkit"
version  = ">=1.0.0"
optional = true

[hooks]
"arbor:plugin_load" = true
"arbor:repo_open"   = false   # Cloud connections are global, not per-repo.
"arbor:tab_switch"  = false
