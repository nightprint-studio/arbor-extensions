[package]
name        = "studio-json-backend"
version     = "2.0.0"
edition.workspace = true
license.workspace = true
description = "JSON backend for Arbor's Studio — implements arbor:extensions/studio-format@1 as a wasm component."

[lib]
name       = "studio_json"
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true, features = ["preserve_order"] }
