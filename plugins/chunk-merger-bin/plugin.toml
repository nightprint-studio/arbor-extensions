name        = "chunk-merger-bin"
version     = "1.0.0"
description = "Retired. Chunk downloads concatenate as they go, so no merge handler is needed — this package contributes nothing and can be uninstalled."
author      = "Nightprint Studio"
repository  = "https://github.com/nightprint-studio/arbor-extensions"
category    = "data"
keywords    = ["binary", "chunks", "merge", "cloud-storage"]
arbor_api   = 1
doc_file    = "doc.html"

# No permissions: it does nothing. It used to hold filesystem write access for the merge, and
# a retired package keeping a capability it cannot use is a capability somebody could be talked
# into using.
[permissions]

[hooks]
"arbor:plugin_load" = true
"arbor:repo_open"   = false
"arbor:tab_switch"  = false

# Hard-required: this plugin only exposes the `chunk-merger-bin.merge` service
# that cloud-storage's chunks.lua calls into. Without cloud-storage there's no
# caller, so refuse to load standalone — the host's dep cascade also disables
# us automatically if cloud-storage is turned off.
[[dependencies]]
name     = "cloud-storage"
version  = ""
optional = false
